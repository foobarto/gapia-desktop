name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version=$INPUT_VERSION
            tag=v$version
          else
            tag=$GITHUB_REF_NAME
            version=${tag#v}
          fi
          printf 'version=%s\ntag=%s\n' "$version" "$tag" >> "$GITHUB_OUTPUT"

      - name: Build and audit distribution
        run: |
          chmod +x scripts/check-release-boundary.sh scripts/create-release-archive.sh
          ./scripts/check-release-boundary.sh .
          ./scripts/create-release-archive.sh "${{ steps.version.outputs.version }}" dist

      - name: Generate Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          archive="dist/gapia-desktop-$VERSION.tar.gz"
          sha256=$(sha256sum "$archive" | cut -d' ' -f1)
          source_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/gapia-desktop-$VERSION.tar.gz"
          sed \
            -e "s|@GITHUB_REPOSITORY@|$GITHUB_REPOSITORY|g" \
            -e "s|@SOURCE_URL@|$source_url|g" \
            -e "s|@VERSION@|$VERSION|g" \
            -e "s|@SHA256@|$sha256|g" \
            Formula/gapia-desktop.rb.in > dist/gapia-desktop.rb
          ruby -c dist/gapia-desktop.rb

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --generate-notes
          fi
