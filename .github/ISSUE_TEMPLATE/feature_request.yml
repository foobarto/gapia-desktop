name: Feature request
description: Propose a concrete improvement to Gapia Desktop
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible behavior, not only an implementation.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Relevant hardware
      description: Vendor, model, and known capability differences, if applicable
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and the documented roadmap.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
